[project]
name = "vaultsearch"
version = "0.2.0"
description = "Hybrid (semantic + keyword) search over an Obsidian vault: a terminal app, a CLI and an MCP server, with automatic incremental indexing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.4",
    "numpy>=1.24",
    "sqlite-vec>=0.1.6",
    "watchdog>=4.0",
    "mcp[cli]>=1.2",
    "python-frontmatter>=1.1",
    "rich>=13",
    "textual>=1.0",
    "textual-image>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
viz = ["umap-learn>=0.5"]  # better 3D layout for `vaultsearch map`; falls back to PCA without it
window = [
    "pywebview>=5",
]

[project.scripts]
vaultsearch = "vaultsearch.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultsearch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "py-spy>=0.4.3",
    "scalene>=2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B905"]  # zip(strict=...) would only add noise: the zipped lists are built side by side
