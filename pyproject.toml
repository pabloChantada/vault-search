[project]
name = "vaultsearch"
version = "0.2.0"
description = "Hybrid (semantic + keyword) search over an Obsidian vault: a terminal app, a CLI and an MCP server, with automatic incremental indexing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "watchdog>=4.0",
    "mcp[cli]>=1.2",
    "python-frontmatter>=1.1",
    "rich>=13",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vaultsearch = "vaultsearch.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultsearch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

