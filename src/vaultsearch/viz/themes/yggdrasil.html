<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yggdrasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0f1714;
    --moss-dark: #18221e;
    --bark: #6b5844;
    --sap: #f2c66d;
    --text: #dfe6e1;
    --muted: #8e9b95;
    --fell: "IM Fell English", "Iowan Old Style", Georgia, serif;
    --sans: "Figtree", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--text); font: 400 14px/1.55 var(--sans); }
  canvas { display: block; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 1.5px solid var(--sap); outline-offset: 3px; border-radius: 3px; }

  .brand { position: fixed; top: 24px; left: 30px; }
  .brand h1 { margin: 0; font: 400 40px/1 var(--fell); }
  .brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .search { margin-top: 18px; width: 230px; }
  .search input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid #34413c; padding: 5px 0; outline: none; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-bottom-color: var(--sap); }
  #results { list-style: none; margin: 6px 0 0; padding: 0; }
  #results button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--muted); font: italic 16px var(--fell); text-align: left; }
  #results button:hover, #results button:focus-visible { color: var(--sap); }

  #branches-wrap { position: fixed; left: 30px; bottom: 26px; }
  #branches { margin: 0; padding: 0; list-style: none; }
  #branches-wrap h2 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  #branches button { display: flex; align-items: baseline; gap: 9px; background: none; border: 0; padding: 2px 0; cursor: pointer; text-align: left; transition: opacity .3s; }
  #branches button[aria-pressed="false"] { opacity: .3; }
  #branches .leaf { width: 11px; height: 7px; border-radius: 0 100% 0 100%; flex: none; }
  #branches .name { font: 17px/1.2 var(--fell); }
  #branches .since { color: var(--muted); font-size: 12px; }

  .caption { position: fixed; right: 30px; bottom: 26px; max-width: 320px; margin: 0; color: var(--muted); font-size: 13px; text-align: right; }

  #panel { position: fixed; top: 110px; right: 30px; width: 290px; max-height: calc(100vh - 210px); overflow: auto; padding: 20px 22px; background: rgba(24, 34, 30, .86); border: 1px solid #2c3934; border-radius: 6px; transition: opacity .35s, transform .35s; }
  #panel[hidden] { display: block; opacity: 0; transform: translateX(10px); pointer-events: none; }
  #panel h2 { margin: 0 26px 4px 0; font: 400 26px/1.15 var(--fell); }
  #panel .path { margin: 0; color: var(--muted); font-size: 12px; word-break: break-word; }
  #panel .dates { margin: 10px 0 0; font-size: 13px; }
  #panel .tags { margin: 6px 0 0; color: var(--sap); font-size: 12px; }
  #panel h3 { margin: 16px 0 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li button { background: none; border: 0; padding: 2px 0; cursor: pointer; font: italic 17px/1.3 var(--fell); text-align: left; }
  #panel li button:hover { color: var(--sap); }
  #panel .none { color: var(--muted); font-size: 13px; }
  #panel .open { margin-top: 16px; padding: 7px 14px; border: 1px solid var(--sap); border-radius: 999px; background: none; color: var(--sap); font-weight: 500; cursor: pointer; }
  #panel .open:hover { background: rgba(242, 198, 109, .12); }
  #panel .close { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; }

  #tip { position: fixed; pointer-events: none; font: italic 17px var(--fell); background: rgba(15, 23, 20, .85); padding: 2px 8px; border-radius: 4px; opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .year { font: italic 14px var(--fell); color: var(--muted); opacity: .75; pointer-events: none; }

  @media (max-width: 760px) {
    .brand h1 { font-size: 30px; }
    .caption { display: none; }
    #branches-wrap { bottom: 16px; }
    #panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 12px; max-height: 50vh; }
  }
</style>
</head>
<body>
<header class="brand">
  <h1>Yggdrasil</h1>
  <p id="sub"></p>
  <div class="search">
    <input id="q" type="search" placeholder="Find a note  /" aria-label="Find a note" autocomplete="off">
    <ul id="results" aria-label="Matching notes"></ul>
  </div>
</header>

<aside id="panel" hidden aria-live="polite">
  <button class="close" aria-label="Close">×</button>
  <h2 id="p-title"></h2>
  <p class="path" id="p-path"></p>
  <p class="dates" id="p-dates"></p>
  <p class="tags" id="p-tags"></p>
  <h3 id="p-links-h">Linked notes</h3>
  <ul id="p-links"></ul>
  <button class="open" id="p-open">Open in Obsidian</button>
</aside>

<nav id="branches-wrap" aria-label="Branches"><h2>Branches</h2><ul id="branches"></ul></nav>
<p class="caption">Height is when a note was written: the roots hold your oldest notes, the crown this month's. Golden sap runs along your [[links]].</p>
<div id="tip"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// In the native window (viz/native.py) WebView2 won't follow obsidian:// links: Python opens them
const openUri = (uri) => window.pywebview?.api ? window.pywebview.api.open_note(uri) : (location.href = uri);
const DATA = /*__DATA__*/null;
const nodes = DATA.nodes, links = DATA.links, N = nodes.length;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// =====================================================================
// Layout: height = when the note was written, branches = folders,
// side of the tree = where the folder sits in embedding space.
// =====================================================================
const HEIGHT = 170, ROOT_SHARE = 0.15, ROOT_STRETCH = 1.5;
const created = nodes.map(n => n.created || n.mtime || 0);
const tMin = Math.min(...created), tMax = Math.max(...created), tSpan = Math.max(tMax - tMin, 1);
const rankOf = new Float32Array(N);
[...nodes.keys()].sort((a, b) => created[a] - created[b]).forEach((i, r) => { rankOf[i] = N > 1 ? r / (N - 1) : 1; });
// Half real time, half rank: gaps in your writing still show, but a busy month doesn't squash the rest
const timeNorm = t => 0.7 * (t - tMin) / tSpan;
const yOf = u => { const y = (u - ROOT_SHARE) * HEIGHT; return y < 0 ? y * ROOT_STRETCH : y; };
nodes.forEach((n, i) => { n.u = timeNorm(created[i]) + 0.3 * rankOf[i]; n.y = yOf(n.u); });
const yTop = Math.max(...nodes.map(n => n.y)), yBottom = Math.min(...nodes.map(n => n.y), -12);

const adj = nodes.map(() => []);
links.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });

const folderNames = [...new Set(nodes.map(n => n.folder))];
const folders = folderNames.map(name => {
  const m = nodes.filter(n => n.folder === name);
  const mean = m.reduce((s, n) => s.add(V3(...n.pos)), V3()).divideScalar(m.length);
  const ys = m.map(n => n.y).sort((a, b) => a - b);
  return { name, members: m, mean, angle: Math.atan2(mean.z, mean.x), y0: ys[Math.floor(ys.length * 0.05)], y1: ys[ys.length - 1], yMin: ys[0] };
});
// Keep the embedding order around the trunk, but space branches evenly so none overlap
folders.sort((a, b) => a.angle - b.angle).forEach((f, k) => {
  const even = -Math.PI + (k + 0.5) * (2 * Math.PI / folders.length);
  f.angle = 0.35 * f.angle + 0.65 * even;
  f.dir = V3(Math.cos(f.angle), 0, Math.sin(f.angle));
});
const maxCount = Math.max(...folders.map(f => f.members.length));
const HUES = [0.27, 0.12, 0.58, 0.04, 0.78, 0.45, 0.9, 0.17, 0.66, 0.33];
folders.forEach((f, k) => {
  f.reach = 34 + 46 * Math.sqrt(f.members.length / maxCount);
  f.color = new THREE.Color().setHSL(HUES[k % HUES.length], 0.5, 0.5);
});
const folderOf = Object.fromEntries(folders.map(f => [f.name, f]));

const trunkR = y => (y < 0 ? 5.6 : 5.6 - 3.8 * Math.min(y / yTop, 1)) + 0.4;
// The bole: bare trunk before the crown opens, so the shape reads as a tree rather than a bush
const BOLE = yTop * 0.24;
// Point on a folder's limb at height y: rises and reaches out over time; roots mirror it below ground
function limb(f, y) {
  if (y >= 0) {
    const start = Math.max(f.y0, BOLE);
    if (y < start) return f.dir.clone().multiplyScalar(trunkR(y)).setY(y);   // early notes sprout straight off the trunk
    const s = THREE.MathUtils.clamp((y - start) / Math.max(yTop - start, 1), 0, 1);
    // Rounded crown: limbs reach furthest two-thirds of the way up, then turn back in
    const a = f.angle + 0.35 * s, r = trunkR(y) + f.reach * Math.sin(s * Math.PI * 0.75) / Math.SQRT1_2 * 0.8;
    return V3(Math.cos(a) * r, y, Math.sin(a) * r);
  }
  const s = THREE.MathUtils.clamp(y / Math.min(yBottom, -1), 0, 1);
  return f.dir.clone().multiplyScalar(trunkR(0) + f.reach * 0.75 * Math.pow(s, 0.7)).setY(y);
}
// Each folder forks into sub-limbs, one per cluster of related notes (k-means in embedding space)
function kmeans(items, k, iters = 12) {
  let cs = items.slice(0, k).map(n => V3(...n.pos));
  let lab = new Array(items.length).fill(0);
  for (let it = 0; it < iters; it++) {
    lab = items.map(n => { const p = V3(...n.pos); let b = 0; cs.forEach((c, j) => { if (p.distanceToSquared(c) < p.distanceToSquared(cs[b])) b = j; }); return b; });
    cs = cs.map((c, j) => { const m = items.filter((_, i) => lab[i] === j); return m.length ? m.reduce((s, n) => s.add(V3(...n.pos)), V3()).divideScalar(m.length) : c; });
  }
  return { lab, cs };
}
for (const f of folders) {
  const k = THREE.MathUtils.clamp(Math.round(f.members.length / 20), 1, 4);
  const { lab, cs } = kmeans([...f.members].sort((a, b) => a.y - b.y).filter((_, i, arr) => true), k);
  const side = V3(-f.dir.z, 0, f.dir.x);
  f.subs = cs.map((c, j) => {
    const m = f.members.filter((_, i) => lab[i] === j);
    const ys = m.map(n => n.y).sort((a, b) => a - b);
    return { members: m, off: k === 1 ? 0 : THREE.MathUtils.clamp(c.clone().sub(f.mean).dot(side) * 4, -0.7, 0.7) || (j - (k - 1) / 2) * 0.4,
             y0: ys[0] ?? 0, y1: ys[ys.length - 1] ?? 0 };
  });
  f.members.forEach((n, i) => { n.sub = f.subs[lab[i]]; });
}
// A sub-limb follows its folder's limb, then swings away from it as it grows
function subLimb(f, sub, y) {
  const p = limb(f, y);
  if (y < 0 || !sub.off) return p;
  const s = THREE.MathUtils.clamp((y - sub.y0) / Math.max(yTop - sub.y0, 1), 0, 1);
  const a = sub.off * Math.pow(s, 0.7), c = Math.cos(a), si = Math.sin(a);
  return V3(p.x * c - p.z * si, y, p.x * si + p.z * c).add(V3(0, 6 * s, 0));
}
nodes.forEach(n => {
  const f = folderOf[n.folder];
  n.anchor = subLimb(f, n.sub, n.y);
  // Spread leaves around their limb using the note's offset from its folder in embedding space
  const d = V3(...n.pos).sub(f.mean);
  const side = V3(-f.dir.z, 0, f.dir.x);
  const twig = side.multiplyScalar(d.x * 34 + d.z * 18).add(f.dir.clone().multiplyScalar(4 + Math.abs(d.z) * 22)).add(V3(0, d.y * 9 + 2, 0));
  if (n.y < 0) twig.multiplyScalar(0.55).setY(-Math.abs(twig.y));
  n.v = n.anchor.clone().add(twig);
});

// =====================================================================
// Scene
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
const dpr = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: "fixed", inset: "0", pointerEvents: "none" });
document.body.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1714);
scene.fog = new THREE.Fog(0x0f1714, 260, 620);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 2000);
const MID = V3(0, (yTop + yBottom) * 0.5, 0);
const span = yTop - yBottom;
const HOME = V3(span * 1.25, MID.y + span * 0.12, span * 1.25);
camera.position.copy(HOME);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(MID);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minDistance = 20;
controls.maxDistance = 700;
controls.autoRotate = !reduced;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9fb5ad, 0x1c140e, 1.1));
const moon = new THREE.DirectionalLight(0xdfe8ff, 1.4);
moon.position.set(-120, 260, 80);
scene.add(moon);

const NOISE = `
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }`;
const uniforms = { uTime: { value: 0 }, uGrow: { value: reduced ? 1e4 : 0 } };

// ---------- bark: tapered tubes, revealed outward from the seed as the tree grows ----------
const barkMat = new THREE.MeshStandardMaterial({ color: 0x7a6650, roughness: 0.95, metalness: 0 });
barkMat.onBeforeCompile = sh => {
  sh.uniforms.uGrow = uniforms.uGrow;
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWorld;")
    .replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvWorld = (modelMatrix * vec4(transformed, 1.)).xyz;");
  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>\nvarying vec3 vWorld; uniform float uGrow; ${NOISE}`)
    .replace("#include <color_fragment>", `#include <color_fragment>
      if (length(vWorld) > uGrow) discard;
      float grain = noise(vec2(atan(vWorld.z, vWorld.x) * 9., vWorld.y * .35));
      diffuseColor.rgb *= .62 + .55 * grain;`);
};
function taperedTube(points, r0, r1, radial = 7) {
  const curve = new THREE.CatmullRomCurve3(points, false, "centripetal");
  const segs = Math.max(8, points.length * 4);
  const g = new THREE.TubeGeometry(curve, segs, 1, radial, false);
  const pos = g.attributes.position;
  for (let i = 0; i <= segs; i++) {
    const c = curve.getPointAt(i / segs), r = THREE.MathUtils.lerp(r0, r1, Math.pow(i / segs, 0.8));
    for (let j = 0; j <= radial; j++) {
      const k = i * (radial + 1) + j;
      const p = V3().fromBufferAttribute(pos, k).sub(c).multiplyScalar(r).add(c);
      pos.setXYZ(k, p.x, p.y, p.z);
    }
  }
  g.computeVertexNormals();
  return g;
}
const barkGeos = [];
{
  const trunk = [];
  for (let y = Math.min(yBottom * 0.25, -6); y <= yTop + 6; y += 8) trunk.push(V3(Math.sin(y * 0.03) * 1.5, y, Math.cos(y * 0.025) * 1.2));
  barkGeos.push(taperedTube(trunk, 7.2, 1.2, 12));
  for (const f of folders) {
    const above = f.members.filter(n => n.y >= 0), below = f.members.filter(n => n.y < 0);
    const thick = 0.7 + 1.9 * Math.sqrt(f.members.length / maxCount);
    if (above.length) {
      const pts = [];
      const from = Math.max(f.y0, BOLE), to = Math.max(...above.map(n => n.y)) + 3;
      for (let k = 0; k <= 10 && to > from; k++) pts.push(limb(f, from + (to - from) * k / 10));
      pts[0] = V3(0, from - 6, 0);
      if (to > from) barkGeos.push(taperedTube(pts, thick * 1.5, 0.25));
      for (const sub of f.subs) {
        if (!sub.off || sub.y1 <= 0) continue;
        const a = Math.max(sub.y0, from + 4), b = sub.y1 + 3, sp = [];
        for (let k = 0; k <= 8; k++) sp.push(subLimb(f, sub, a + (b - a) * k / 8));
        barkGeos.push(taperedTube(sp, thick * 0.75, 0.18, 6));
      }
    }
    if (below.length) {
      const pts = [], to = Math.min(...below.map(n => n.y)) - 3;
      for (let k = 0; k <= 8; k++) pts.push(limb(f, to * k / 8));
      pts[0] = V3(0, 2, 0);
      barkGeos.push(taperedTube(pts, thick * 1.3, 0.2));
    }
  }
}
for (const g of barkGeos) scene.add(new THREE.Mesh(g, barkMat));

// Twigs: from each leaf back to its limb
{
  const p = [];
  nodes.forEach(n => p.push(n.anchor.x, n.anchor.y, n.anchor.z, n.v.x, n.v.y, n.v.z));
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x8a7458, transparent: true, opacity: 0.3 })));
}

// Ground: a faint disc of mist where the roots meet the trunk
{
  const g = new THREE.CircleGeometry(150, 64).rotateX(-Math.PI / 2);
  scene.add(new THREE.Mesh(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    vertexShader: `varying vec2 vP; void main(){ vP = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: `varying vec2 vP; void main(){ float d = length(vP) / 150.; gl_FragColor = vec4(vec3(.11, .15, .13), (1. - smoothstep(.05, 1., d)) * .28); }`,
  })));
}

// Year rings around the trunk
{
  const first = new Date(tMin * 1000).getFullYear() + 1, last = new Date(tMax * 1000).getFullYear();
  for (let yr = first; yr <= last; yr++) {
    const t = new Date(yr, 0, 1).getTime() / 1000;
    // Invert the time mapping approximately with the nearest notes
    let below = 0, total = 0;
    for (const c of created) { total++; if (c < t) below++; }
    const y = yOf(timeNorm(t) + 0.3 * (below / Math.max(total - 1, 1)));
    const ring = new THREE.Mesh(new THREE.TorusGeometry(trunkR(y) + 3, 0.12, 4, 64).rotateX(Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xb9a888, transparent: true, opacity: 0.35 }));
    ring.position.y = y;
    scene.add(ring);
    const el = Object.assign(document.createElement("div"), { className: "year", textContent: yr });
    const lbl = new CSS2DObject(el);
    ring.add(lbl);
    lbl.position.set(trunkR(y) + 6, 0, 0);
  }
}

// ---------- leaves: one per note ----------
const quad = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1, 1));
const iPos = new Float32Array(N * 3), iCol = new Float32Array(N * 3), iSize = new Float32Array(N), iSeed = new Float32Array(N);
const iFresh = new Float32Array(N), iDim = new Float32Array(N).fill(1), iRoot = new Float32Array(N);
const byEdit = [...nodes.keys()].sort((a, b) => (nodes[a].mtime || 0) - (nodes[b].mtime || 0));
byEdit.forEach((i, r) => { iFresh[i] = N > 1 ? r / (N - 1) : 1; });
nodes.forEach((n, i) => {
  iPos.set(n.v.toArray(), i * 3);
  iCol.set(folderOf[n.folder].color.toArray(), i * 3);
  iSize[i] = 3.2 + Math.sqrt(adj[i].length) * 1.3;
  iSeed[i] = Math.random();
  iRoot[i] = n.y < 0 ? 1 : 0;
});
const ia = (name, arr, size) => quad.setAttribute(name, new THREE.InstancedBufferAttribute(arr, size));
ia("iPos", iPos, 3); ia("iCol", iCol, 3); ia("iSize", iSize, 1); ia("iSeed", iSeed, 1);
ia("iFresh", iFresh, 1); ia("iDim", iDim, 1); ia("iRoot", iRoot, 1);
quad.instanceCount = N;
const leafMat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  vertexShader: `attribute vec3 iPos, iCol; attribute float iSize, iSeed, iFresh, iDim, iRoot;
    uniform float uTime, uGrow; varying vec2 vUv; varying vec3 vCol; varying float vA, vRoot, vFresh;
    void main(){
      float born = smoothstep(length(iPos) - 4., length(iPos) + 10., uGrow);
      float sway = sin(uTime * .9 + iSeed * 30. + iPos.y * .05) * .25 * (1. - iRoot);
      float ang = iSeed * 6.283 + sway;
      vec2 c = position.xy * iSize * mix(.7, 1., iDim) * born;
      c = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * c;
      vec4 mv = modelViewMatrix * vec4(iPos, 1.);
      mv.xy += c;
      gl_Position = projectionMatrix * mv;
      vUv = position.xy; vCol = iCol; vRoot = iRoot; vFresh = iFresh;
      vA = born * mix(.08, 1., iDim);
    }`,
  fragmentShader: `varying vec2 vUv; varying vec3 vCol; varying float vA, vRoot, vFresh;
    void main(){
      vec2 p = vUv * 2.;
      float a;
      if (vRoot > .5) {                                 // roots carry seeds, not leaves
        a = smoothstep(.62, .5, length(p * vec2(1., 1.25)));
      } else {                                          // almond leaf with a midrib
        float w = .5 * (1. - p.y * p.y);
        a = smoothstep(w, w - .1, abs(p.x)) * step(abs(p.y), 1.);
        a *= 1. - .35 * smoothstep(.06, 0., abs(p.x)) * step(-.85, p.y);
      }
      // Notes you haven't edited in a while turn autumnal
      vec3 autumn = mix(vec3(.55, .32, .16), vCol, .35);
      vec3 col = mix(autumn, vCol, smoothstep(.0, .55, vFresh));
      if (vRoot > .5) col = mix(vec3(.42, .34, .26), vCol, .35);
      col *= .55 + .4 * vFresh;
      if (a * vA < .02) discard;
      gl_FragColor = vec4(col, a * vA);
    }`,
});
const leaves = new THREE.Mesh(quad, leafMat);
leaves.frustumCulled = false;
scene.add(leaves);

// ---------- sap: [[links]] routed through the tree ----------
function sapPath(a, b) {
  const A = nodes[a], B = nodes[b];
  const tA = V3(0, A.y, 0), tB = V3(0, B.y, 0);
  const pts = [A.v, A.anchor, tA.clone().lerp(A.anchor, 0.15), tB.clone().lerp(B.anchor, 0.15), B.anchor, B.v];
  if (A.folder === B.folder && Math.abs(A.y - B.y) < 25) pts.splice(2, 2);   // same limb: stay on the branch
  return new THREE.CatmullRomCurve3(pts, false, "centripetal", 0.3).getSpacedPoints(48);
}
const sapLine = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xf2c66d, transparent: true, opacity: 0.9 }));
scene.add(sapLine);
function showSap(i) {
  const pos = [];
  if (i >= 0) for (const j of adj[i]) {
    if (!shown(j)) continue;
    const p = sapPath(i, j);
    for (let k = 0; k < p.length - 1; k++) pos.push(...p[k].toArray(), ...p[k + 1].toArray());
  }
  sapLine.geometry.dispose();
  sapLine.geometry = new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
}

// Drops of sap drifting along a sample of links, all the time
const FLOW = Math.min(links.length, 260);
const flowPaths = [...links].sort(() => Math.random() - 0.5).slice(0, FLOW).map(([a, b]) => ({ a, b, p: sapPath(a, b), off: Math.random() }));
const flowPos = new Float32Array(FLOW * 3);
const flowGeo = new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(flowPos, 3));
const flowMat = new THREE.PointsMaterial({ color: 0xf2c66d, size: 1.6, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending });
scene.add(new THREE.Points(flowGeo, flowMat));

// Ratatoskr: the messenger, running the sap to each linked note in turn
const squirrel = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffd98a }));
squirrel.visible = false;
scene.add(squirrel);
const trailGeo = new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(30 * 3), 3));
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffd98a, transparent: true, opacity: 0.7 }));
trail.visible = false;
scene.add(trail);
let run = null;

// ---------- post-processing: only the sap is bright enough to bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.9, 0.45, 0.82));
composer.addPass(new OutputPass());

// =====================================================================
// State and UI
// =====================================================================
const $ = id => document.getElementById(id);
const hidden = new Set();
let query = "", selected = -1, hovered = -1;
const matches = i => !query || nodes[i].title.toLowerCase().includes(query) || nodes[i].path.toLowerCase().includes(query);
const shown = i => !hidden.has(nodes[i].folder);

function paint() {
  const focusI = selected >= 0 ? selected : hovered;
  const focus = focusI >= 0 ? new Set([focusI, ...adj[focusI]]) : null;
  for (let i = 0; i < N; i++) {
    let d = shown(i) ? (matches(i) ? 1 : 0.2) : 0;
    if (focus) d = focus.has(i) ? (shown(i) ? 1 : 0) : d * 0.3;
    iDim[i] = d;
  }
  quad.attributes.iDim.needsUpdate = true;
  showSap(focusI);
}

const year = t => new Date(t * 1000).getFullYear();
$("sub").textContent = `${DATA.vault}, ${N.toLocaleString()} notes written ${year(tMin)}–${year(tMax)}`;
document.title = `Yggdrasil · ${DATA.vault}`;
for (const f of [...folders].sort((a, b) => a.yMin - b.yMin)) {
  const li = document.createElement("li"), b = document.createElement("button");
  b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="leaf"></span><span class="name"></span><span class="since"></span>`;
  b.querySelector(".leaf").style.background = "#" + f.color.getHexString();
  b.querySelector(".name").textContent = f.name;
  b.querySelector(".since").textContent = `since ${year(Math.min(...f.members.map(n => n.created || n.mtime)))}`;
  b.onclick = () => {
    hidden.has(f.name) ? hidden.delete(f.name) : hidden.add(f.name);
    b.setAttribute("aria-pressed", String(!hidden.has(f.name)));
    if (selected >= 0 && hidden.has(nodes[selected].folder)) deselect(); else paint();
  };
  li.appendChild(b);
  $("branches").appendChild(li);
}

function when(t, verb) {
  if (!t) return "";
  return `${verb} ${new Date(t * 1000).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}`;
}

let flight = null;
function flyTo(target, eye, ms = 1500) {
  flight = { t0: performance.now(), ms: reduced ? 1 : ms, fromT: controls.target.clone(), toT: target, fromE: camera.position.clone(), toE: eye };
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function select(i) {
  selected = i;
  const n = nodes[i];
  $("p-title").textContent = n.title;
  $("p-path").textContent = n.path;
  $("p-dates").innerHTML = "";
  $("p-dates").append(when(n.created, "Written"), document.createElement("br"), when(n.mtime, "Last edited"));
  $("p-tags").textContent = n.tags.map(t => "#" + t).join("  ");
  $("p-links-h").textContent = adj[i].length ? `Linked notes (${adj[i].length})` : "Linked notes";
  const list = $("p-links");
  list.replaceChildren();
  if (!adj[i].length) list.appendChild(Object.assign(document.createElement("li"), { className: "none", textContent: "No [[links]] to or from this note yet." }));
  [...adj[i]].sort((a, b) => nodes[a].title.localeCompare(nodes[b].title)).forEach(j => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.textContent = nodes[j].title;
    b.onclick = () => select(j);
    li.appendChild(b);
    list.appendChild(li);
  });
  $("results").replaceChildren();
  $("panel").hidden = false;
  controls.autoRotate = false;
  const out = V3(n.v.x, 0, n.v.z).normalize();
  if (out.lengthSq() < 0.01) out.set(1, 0, 0);
  const side = V3(-out.z, 0, out.x);
  flyTo(n.v.clone(), n.v.clone().addScaledVector(out, 70).addScaledVector(side, 30).add(V3(0, 18, 0)));
  const targets = adj[i].filter(shown);
  run = targets.length ? { targets, k: 0, t0: performance.now() } : null;
  paint();
}
function deselect() {
  selected = -1;
  run = null;
  $("panel").hidden = true;
  flyTo(MID.clone(), HOME.clone(), 1700);
  controls.autoRotate = !reduced;
  paint();
}
$("p-open").onclick = () => {
  if (selected >= 0) openUri(`obsidian://open?vault=${encodeURIComponent(DATA.vault)}&file=${encodeURIComponent(nodes[selected].path)}`);
};
document.querySelector("#panel .close").onclick = deselect;

const q = $("q"), results = $("results");
q.oninput = () => {
  query = q.value.trim().toLowerCase();
  results.replaceChildren();
  if (query) for (let i = 0; i < N && results.children.length < 6; i++) {
    if (!matches(i) || !shown(i)) continue;
    const li = document.createElement("li"), b = document.createElement("button");
    b.textContent = nodes[i].title;
    b.onclick = () => select(i);
    li.appendChild(b);
    results.appendChild(li);
  }
  paint();
};
q.onkeydown = e => {
  if (e.key === "Enter" && results.firstChild) results.firstChild.firstChild.click();
  if (e.key === "Escape") { q.value = ""; q.oninput(); q.blur(); }
};
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  else if (e.key === "Escape" && selected >= 0 && document.activeElement !== q) deselect();
});

// ---------- picking: nearest leaf on screen ----------
const tmp = V3();
function pick(x, y) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < N; i++) {
    if (iDim[i] < 0.15) continue;
    tmp.copy(nodes[i].v).project(camera);
    if (tmp.z > 1) continue;
    const sx = (tmp.x + 1) / 2 * innerWidth, sy = (1 - tmp.y) / 2 * innerHeight;
    const d = Math.hypot(sx - x, sy - y);
    if (d < 12 && d < bd) { bd = d; best = i; }
  }
  return best;
}
const tip = $("tip");
let down = null;
renderer.domElement.addEventListener("pointermove", e => {
  if (uniforms.uGrow.value < 400) return;
  const i = pick(e.clientX, e.clientY);
  if (i !== hovered) { hovered = i; if (selected < 0) paint(); }
  renderer.domElement.style.cursor = i >= 0 ? "pointer" : "";
  if (selected < 0) controls.autoRotate = i < 0 && !reduced;
  if (i < 0) { tip.style.opacity = 0; return; }
  tip.textContent = nodes[i].title;
  Object.assign(tip.style, { opacity: 1, left: e.clientX + 14 + "px", top: e.clientY + 10 + "px" });
});
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const i = pick(e.clientX, e.clientY);
  if (i >= 0) select(i); else if (selected >= 0) deselect();
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labels.setSize(innerWidth, innerHeight);
});

// =====================================================================
// Loop
// =====================================================================
paint();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;
  if (!reduced) uniforms.uGrow.value = Math.pow(Math.max(t - 0.4, 0) / 4, 1.4) * 260;   // the tree grows from its seed
  if (flight) {
    const k = Math.min((performance.now() - flight.t0) / flight.ms, 1), e = ease(k);
    controls.target.lerpVectors(flight.fromT, flight.toT, e);
    camera.position.lerpVectors(flight.fromE, flight.toE, e);
    if (k >= 1) flight = null;
  }
  controls.update();

  // sap drifting along the links (hidden folders stop flowing)
  for (let k = 0; k < FLOW; k++) {
    const f = flowPaths[k], p = f.p;
    const on = shown(f.a) && shown(f.b) && uniforms.uGrow.value > 300;
    const s = ((t * 0.08 + f.off) % 1) * (p.length - 1), i0 = Math.floor(s);
    const pt = on ? p[i0].clone().lerp(p[Math.min(i0 + 1, p.length - 1)], s - i0) : V3(0, -1e4, 0);
    flowPos.set(pt.toArray(), k * 3);
  }
  flowGeo.attributes.position.needsUpdate = true;
  flowMat.opacity = selected >= 0 ? 0.25 : 0.8;

  // Ratatoskr carries the message along each link of the selected note
  if (run && selected >= 0) {
    const path = sapPath(selected, run.targets[run.k]);
    let s = (performance.now() - run.t0) / 1800;
    if (s >= 1.25) { run.k = (run.k + 1) % run.targets.length; run.t0 = performance.now(); s = 0; }
    const u = Math.min(s, 1) * (path.length - 1), i0 = Math.floor(u);
    squirrel.position.copy(path[i0]).lerp(path[Math.min(i0 + 1, path.length - 1)], u - i0);
    const tp = trailGeo.attributes.position;
    for (let k = 0; k < 30; k++) { const j = Math.max(i0 - k, 0); tp.setXYZ(k, path[j].x, path[j].y, path[j].z); }
    tp.needsUpdate = true;
    squirrel.visible = trail.visible = true;
  } else squirrel.visible = trail.visible = false;

  composer.render();
  labels.render(scene, camera);
});
</script>
</body>
</html>
