<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vaultsearch · 3D map</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #d6dbe4; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; width: 240px; background: #161b22e6; border: 1px solid #2a313c; border-radius: 8px; padding: 10px 12px; }
  #ui h1 { font-size: 14px; margin: 0 0 2px; }
  #meta { color: #7d8794; margin-bottom: 8px; }
  #q { width: 100%; box-sizing: border-box; background: #0e1116; color: inherit; border: 1px solid #2a313c; border-radius: 5px; padding: 5px 7px; margin-bottom: 8px; }
  #legend { max-height: 50vh; overflow: auto; }
  .f { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; user-select: none; }
  .f.off { opacity: .35; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .n { margin-left: auto; color: #7d8794; }
  #tip { position: fixed; pointer-events: none; background: #161b22; border: 1px solid #2a313c; border-radius: 6px; padding: 6px 8px; display: none; max-width: 320px; }
  #tip .p { color: #7d8794; font-size: 12px; }
  #hint { position: fixed; bottom: 10px; left: 12px; color: #7d8794; }
</style>
</head>
<body>
<div id="ui">
  <h1>Vault map</h1>
  <div id="meta"></div>
  <input id="q" placeholder="Highlight notes…" autocomplete="off">
  <div id="legend"></div>
</div>
<div id="tip"></div>
<div id="hint">drag to orbit · scroll to zoom · click a note to open it in Obsidian</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const DATA = /*__DATA__*/null;
const SPREAD = 60;
const nodes = DATA.nodes;

// One colour per top-level folder, spaced around the hue wheel
const folders = [...new Set(nodes.map(n => n.folder))].sort();
const colorOf = Object.fromEntries(folders.map((f, i) =>
  [f, new THREE.Color().setHSL((i * 0.618034) % 1, 0.65, 0.6)]));
const hidden = new Set();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0e1116, 0.006);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, SPREAD * 2.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 1, 1);
scene.add(sun);

// Notes: one instanced mesh, so thousands of points stay cheap
const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.8, 14, 10),
  new THREE.MeshStandardMaterial({ roughness: 0.5 }), nodes.length);
const m4 = new THREE.Matrix4(), v3 = new THREE.Vector3();
nodes.forEach((n, i) => {
  n.v = new THREE.Vector3(...n.pos).multiplyScalar(SPREAD);
  m4.makeTranslation(n.v.x, n.v.y, n.v.z);
  mesh.setMatrixAt(i, m4);
});
scene.add(mesh);

// Links: thin, translucent segments
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute("position", new THREE.Float32BufferAttribute(
  DATA.links.flatMap(([a, b]) => [...nodes[a].v.toArray(), ...nodes[b].v.toArray()]), 3));
const lines = new THREE.LineSegments(lineGeo,
  new THREE.LineBasicMaterial({ color: 0x8899aa, transparent: true, opacity: 0.18 }));
scene.add(lines);

let query = "";
function paint() {
  const dim = new THREE.Color(0x2a313c);
  nodes.forEach((n, i) => {
    const match = !query || n.title.toLowerCase().includes(query) || n.path.toLowerCase().includes(query);
    const visible = !hidden.has(n.folder);
    mesh.setColorAt(i, visible && match ? colorOf[n.folder] : dim);
    m4.makeScale(...Array(3).fill(visible ? (query && match ? 1.8 : 1) : 0.4)).setPosition(n.v);
    mesh.setMatrixAt(i, m4);
  });
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.instanceMatrix.needsUpdate = true;
}

// Sidebar
document.getElementById("meta").textContent =
  `${nodes.length} notes · ${DATA.links.length} links · ${DATA.method.toUpperCase()}`;
const legend = document.getElementById("legend");
for (const f of folders) {
  const row = document.createElement("div");
  row.className = "f";
  row.innerHTML = `<span class="dot" style="background:#${colorOf[f].getHexString()}"></span>` +
    `<span></span><span class="n">${nodes.filter(n => n.folder === f).length}</span>`;
  row.children[1].textContent = f;
  row.onclick = () => { hidden.has(f) ? hidden.delete(f) : hidden.add(f); row.classList.toggle("off"); paint(); };
  legend.appendChild(row);
}
document.getElementById("q").oninput = e => { query = e.target.value.trim().toLowerCase(); paint(); };

// Hover + click
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById("tip");
let hovered = -1;
addEventListener("pointermove", e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(mesh)[0];
  hovered = hit && !hidden.has(nodes[hit.instanceId].folder) ? hit.instanceId : -1;
  controls.autoRotate = hovered < 0;
  renderer.domElement.style.cursor = hovered < 0 ? "" : "pointer";
  if (hovered < 0) { tip.style.display = "none"; return; }
  const n = nodes[hovered];
  tip.innerHTML = "<div><b></b></div><div class='p'></div>";
  tip.querySelector("b").textContent = n.title;
  tip.querySelector(".p").textContent = n.path + (n.tags.length ? "  #" + n.tags.join(" #") : "");
  Object.assign(tip.style, { display: "block", left: e.clientX + 14 + "px", top: e.clientY + 14 + "px" });
});
renderer.domElement.addEventListener("click", () => {
  if (hovered >= 0) location.href =
    `obsidian://open?vault=${encodeURIComponent(DATA.vault)}&file=${encodeURIComponent(nodes[hovered].path)}`;
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

paint();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
